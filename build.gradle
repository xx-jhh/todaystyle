plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'todaystyle'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'com.cloudinary:cloudinary-http5:2.4.0'
    // Spring Boot 4는 자동설정을 세분화된 모듈로 쪼갰다 — flyway-core/flyway-mysql만 넣으면
    // FlywayAutoConfiguration 자체가 클래스패스에 없어 조용히 동작 안 한다(부팅 로그에 flyway
    // 언급이 전혀 없는 걸로 확인). 이 모듈을 명시적으로 추가해야 자동설정이 활성화된다.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 프론트(frontend/)를 빌드해서 백엔드가 같은 오리진에서 서빙하도록 묶는다. build/resources/main
// (소스 관리 대상 아님)로만 복사하고 src/main/resources/static에는 손대지 않는다 — frontend/dist는
// 이미 gitignore 대상이라 빌드 산출물을 커밋하지 않는 것과 일관된 선택.
// 처음엔 별도 Copy 태스크(copyFrontend)로 build/resources/main에 직접 썼는데, Gradle이
// "이 디렉터리는 processResources가 관리하는 출력인데 copyFrontend가 그 사실을 선언 안 하고
// 같이 쓴다"며 태스크 순서를 보장 못 한다고 빌드를 막았다(resolveMainClassName이 copyFrontend
// 완료 전에 먼저 읽어버릴 수 있음). processResources 자신의 복사 작업에 frontend/dist를
// 추가 입력으로 포함시켜 출력 디렉터리의 소유권을 하나로 유지하는 게 Gradle이 권장하는 해결책.
tasks.register('npmInstallFrontend', Exec) {
    workingDir 'frontend'
    inputs.file('frontend/package-lock.json')
    outputs.dir('frontend/node_modules')
    commandLine 'npm', 'ci'
}

tasks.register('buildFrontend', Exec) {
    dependsOn tasks.named('npmInstallFrontend')
    workingDir 'frontend'
    inputs.dir('frontend/src')
    inputs.file('frontend/index.html')
    inputs.file('frontend/vite.config.ts')
    outputs.dir('frontend/dist')
    commandLine 'npm', 'run', 'build'
}

tasks.named('processResources') {
    dependsOn tasks.named('buildFrontend')
    from('frontend/dist') {
        into 'static'
    }
}
