name: CI

# main에 push되면: 테스트 실행 → 통과하면 Docker 이미지 빌드 → GitHub Container Registry(ghcr.io)에 push.
# EC2 반영은 자동화하지 않는다 — 실제 지인들이 쓰는 서비스라, 새 이미지를 서버에 적용하는 건
# 사람이 확인 후 직접 pull/재시작하는 수동 단계로 남겨둔다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ./gradlew test 는 main 소스의 processResources(=프론트엔드 빌드)까지 트리거하므로
      # Node.js가 CI 러너에도 있어야 한다 (Dockerfile 빌드 스테이지와 동일한 이유).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
