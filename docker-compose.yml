# 로컬 개발용. 운영(EC2)의 MariaDB 10.5와 버전을 맞춰서, "로컬에서는 되는데 운영에서는
# 안 되는" 문제(예: 실제로 겪었던 콜레이션 이슈)를 배포 전에 미리 잡을 수 있게 한다.
services:
  db:
    image: mariadb:10.5
    environment:
      MARIADB_DATABASE: todaystyle
      MARIADB_USER: todaystyle_user
      MARIADB_PASSWORD: ${DB_PASSWORD:-todaystyle_local}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-todaystyle_local}
    # 호스트에 포트를 열지 않는다 — app 컨테이너는 도커 네트워크 안에서 host명 "db"로
    # 바로 접근하므로 필요 없고, 로컬에 이미 떠 있는 MySQL(3306)과의 충돌도 피한다.
    # DB 클라이언트로 직접 붙어봐야 하면 필요할 때만 `docker compose exec db mysql ...`.
    volumes:
      - todaystyle-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
      # Actuator/Prometheus 메트릭(별도 포트, application.yaml의 management.server.port).
      # 127.0.0.1로만 바인딩해서 이 머신 밖에서는 접근 못 하게 한다.
      - "127.0.0.1:9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/todaystyle
      DB_USERNAME: todaystyle_user
      DB_PASSWORD: ${DB_PASSWORD:-todaystyle_local}
      # 기본값을 박아두면 공개 저장소를 본 누구나 그 값으로 토큰을 위조할 수 있어서,
      # .env에 직접 값을 넣도록 강제한다(없으면 docker compose가 바로 에러로 알려준다).
      JWT_SECRET: "${JWT_SECRET:?.env에 JWT_SECRET을 설정하세요 (openssl rand -base64 32로 생성)}"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}

  # 부하테스트(loadtest/) 중 app의 실시간 상태(요청 지연, HikariCP, JVM)를 그래프로 보기 위한
  # 모니터링 스택. 로컬 전용 — 운영 배포(deploy.sh)는 이 파일이 아니라 app 컨테이너 하나만
  # 단독 실행하므로 이 두 서비스와 무관하다.
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # 로컬 전용 편의 설정 — 매번 로그인하지 않아도 바로 대시보드가 보이게.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  todaystyle-db-data:
