spring:
  datasource:
    url: jdbc:mysql://localhost:3306/todaystyle
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      # OOTD 사진 업로드 최대 크기
      max-file-size: 10MB
      max-request-size: 10MB

cloudinary:
  # 이미지 저장소. 아직 미발급 상태여도 앱은 정상 부팅되며, 실제 업로드 시점에만 필요.
  # 운영/배포 시 환경변수(CLOUDINARY_CLOUD_NAME 등)로 주입할 것.
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

jwt:
  # HS256 서명용 시크릿 (최소 32바이트). 운영에서는 환경변수로 주입할 것.
  secret: ${JWT_SECRET:todaystyle-local-dev-secret-key-change-me-please-32bytes}
  # 액세스 토큰 만료 시간 (밀리초). 기본 24시간.
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

kma:
  # 기상청 단기예보 조회서비스 (공공데이터포털). 서비스키 미발급 상태여도 앱은 정상 부팅되며,
  # 실제 날씨 조회 시점에만 필요. 공공데이터포털에서 발급받은 "일반 인증키(Decoding)"를 넣을 것.
  base-url: http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
  service-key: ${KMA_SERVICE_KEY:}