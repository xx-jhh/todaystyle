spring:
  datasource:
    url: jdbc:mysql://localhost:3306/todaystyle
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 스키마는 이제 Flyway(db/migration)가 관리한다. Hibernate는 엔티티-스키마 불일치만
      # 검증하고(validate) 직접 스키마를 바꾸지 않는다 — auto-DDL은 배포 시 예기치 않은
      # 스키마 변경(컬럼 삭제/타입 변경 미반영 등) 위험이 있어서 마이그레이션 도구로 교체.
      ddl-auto: validate
  flyway:
    # 기존에 ddl-auto:update로 이미 만들어져 있던 로컬/운영 DB는 V1을 재실행하지 않고
    # "이미 V1까지 적용된 상태"로 기록만 한다(베이스라인). 완전히 빈 DB(신규 환경/CI)에서는
    # 이 설정과 무관하게 V1이 정상적으로 처음부터 실행된다.
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    # 비밀번호 재설정 메일 발송(Gmail SMTP). 앱 비밀번호는 운영에서 환경변수로 주입할 것.
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      # OOTD 사진 업로드 최대 크기
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    web:
      pageable:
        # 목록 API(?size=)에 비정상적으로 큰 값을 넣어도 한 번에 이 이상은 못 긁어가게 상한.
        max-page-size: 50
  task:
    execution:
      # OOTD 업로드 후 날씨 스냅샷/옷 아이템 자동 인식(Gemini)을 처리하는 @Async 스레드풀.
      # 요청 스레드를 막지 않되, 무제한 스레드 생성은 막기 위해 명시적으로 상한을 둔다.
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 50
      thread-name-prefix: ootd-enrich-

server:
  # nginx(리버스 프록시)가 X-Forwarded-For/X-Forwarded-Proto 헤더로 실제 클라이언트 IP와
  # 프로토콜(https)을 넘겨주는데, 이 설정이 없으면 Spring이 그 헤더를 무시하고
  # request.getRemoteAddr()가 항상 nginx가 붙는 127.0.0.1로만 찍힌다 — 그러면
  # RateLimitInterceptor의 IP별 요청 제한이 사실상 전체 트래픽에 대해 하나로 뭉쳐진다.
  # "framework"로 설정하면 Spring이 표준 X-Forwarded-* 헤더를 신뢰해 실제 클라이언트 IP를
  # 복원한다. 8080 포트가 보안그룹에서 막혀있어 nginx를 거치지 않은 직접 요청이 불가능하므로,
  # 이 헤더를 위조해서 들어올 경로가 없어 안전하게 켤 수 있다.
  forward-headers-strategy: framework
  servlet:
    encoding:
      # JSON 스펙(RFC 8259)상 UTF-8이 기본이라 Spring이 Content-Type에 charset을 생략하는데,
      # 이걸 charset 없는 그대로 받는 일부 클라이언트(IntelliJ HTTP Client 등)가 한글을 다른
      # 인코딩으로 오추측해서 깨져 보이는 문제가 있었다. 요청/응답 모두 UTF-8로 명시 고정.
      charset: UTF-8
      force: true

# Prometheus/Grafana용 메트릭. 메인 앱 포트(8080, nginx가 프록시)와 분리된 별도 포트로 띄운다
# — Spring Boot는 management.server.port가 설정되면 이 엔드포인트들을 메인 SecurityFilterChain이
# 전혀 안 걸리는 별도 내장 서버로 분리한다. EC2 보안그룹은 80/443/22만 열려 있어 9090은
# 애초에 외부에서 접근 불가능하고, 로컬/도커 네트워크 안에서만(Prometheus 컨테이너 등) 닿는다.
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    # 메일은 이 앱에서 원래 선택 기능(재설정 메일 실패해도 로그만 남기고 서비스는 정상 동작,
    # AuthService 참고) — 헬스체크까지 SMTP 상태에 발목 잡히면 진짜 다운이 아닌데 DOWN으로
    # 나와서 모니터링 신호가 왜곡된다.
    mail:
      enabled: false

cloudinary:
  # 이미지 저장소. 아직 미발급 상태여도 앱은 정상 부팅되며, 실제 업로드 시점에만 필요.
  # 운영/배포 시 환경변수(CLOUDINARY_CLOUD_NAME 등)로 주입할 것.
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

jwt:
  # HS256 서명용 시크릿 (최소 32바이트). 저장소에 기본값을 박아두면 공개 저장소를 본 누구나
  # 그 값으로 토큰을 위조할 수 있어서, 기본값 없이 환경변수 필수로 강제한다(없으면 기동 실패).
  secret: ${JWT_SECRET}
  # 액세스 토큰 만료 시간 (밀리초). 기본 24시간.
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

kma:
  # 기상청 단기예보 조회서비스 (공공데이터포털). 서비스키 미발급 상태여도 앱은 정상 부팅되며,
  # 실제 날씨 조회 시점에만 필요. 공공데이터포털에서 발급받은 "일반 인증키(Decoding)"를 넣을 것.
  base-url: http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
  service-key: ${KMA_SERVICE_KEY:}

gemini:
  # OOTD 사진에서 옷 아이템(category/color/fit) 자동 추출. API 키 미발급 상태여도 앱은 정상
  # 부팅되며, 업로드 시점에 best-effort로만 호출된다(실패해도 업로드 자체는 성공).
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-flash-lite-latest}

discord:
  # ERROR 로그 발생 시 알림 보낼 웹훅 URL. 미설정이어도 앱은 정상 동작하고 알림만 안 나간다.
  webhook-url: ${DISCORD_WEBHOOK_URL:}

app:
  # 재설정 메일 링크(https://host/reset-password?token=...)를 만들 때 쓰는 프론트 오리진.
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors:
    # 브라우저에서 API를 직접 호출할 수 있는 출처(origin) 허용 목록(콤마 구분).
    # 지금은 로컬 프론트 개발 서버(Vite)만 허용. 배포 도메인이 정해지면 CORS_ALLOWED_ORIGINS
    # 환경변수에 콤마로 추가할 것(예: https://todaystyle.example.com,http://localhost:5173).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}